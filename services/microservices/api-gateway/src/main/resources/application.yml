spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8070  # URL of customer-service
          predicates:
            - Path=/customer/**
        - id: product-service
          uri: http://localhost:8080  # URL of product-service
          predicates:
            - Path=/products/**
server:
  port: 8099